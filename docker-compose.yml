name: dziflip

# Local development database only. Production runs on your Vercel/Prisma
# Postgres project, configured entirely through environment variables —
# nothing here is ever used in production.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dziflip
    ports:
      - "5432:5432"
    volumes:
      - dziflip_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dziflip_pgdata:
